  var SFX = (function(){
    var ctx = null;
    function ac(){ if (!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } }
      if (ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} } return ctx; }
    function beep(f1, f2, dur, type, vol){
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f1, c.currentTime);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + dur);
      g.gain.setValueAtTime(vol || .14, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + .02);
    }
    return {
      click:function(){ beep(760,1180,.09,'square',.09); },
      hover:function(){ beep(1500,1700,.045,'sine',.035); },
      open:function(){ beep(420,900,.16,'triangle',.12); },
      close:function(){ beep(760,380,.15,'triangle',.11); },
      error:function(){ beep(300,240,.2,'sawtooth',.1); }

    if (!BGM.on || i >= list.length) return;
    var a = new Audio(list[i]); a.loop=true; a.volume=0; a.preload='auto';

  function injectCss(css){ var s = document.createElement('style'); s.id='arcSkinCss'; s.textContent = css; document.head.appendChild(s); }
  function extractCss(html){
    var out = [], re = /<style[^>]*>([\s\S]*?)<\/style>/gi, m;
    while ((m = re.exec(html))) out.push(m[1]);
    return out.join('\n');
  }
  function extractChrome(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var parts = [];
    Array.prototype.forEach.call(doc.body.children, function(el){
      if (el.tagName === 'SCRIPT') return;
      if (el.id === 'arcMsg') return;
      parts.push(el.outerHTML);
    });
    return parts.join('\n');
  }
  function loadSkin(){
    var css = '', chrome = '';
    try{ css = localStorage.getItem(K_CSS) || ''; chrome = localStorage.getItem(K_CHROME) || ''; }catch(e){}
    if (css && chrome){ injectCss(css); document.body.innerHTML = chrome; return Promise.resolve(true); }

    /* 1) 先用同目录 style.css（如果已导出） */
    var p0 = fetch('style.css', { cache:'no-store' }).then(function(r){
      if (!r.ok) throw 0; return r.text();
    }).then(function(t){ if (t && t.length > 400) css = t; }).catch(function(){});

    return p0.then(function(){
      if (css && chrome){ injectCss(css); document.body.innerHTML = chrome; return true; }
      /* 2) 从皮肤源文件提取 */
      return fetch(SKIN_HTML, { cache:'no-store' }).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(html){
        if (!css) css = extractCss(html);
        if (!chrome) chrome = extractChrome(html);
        if (!css || !chrome) throw new Error('皮肤内容为空');
        try{ localStorage.setItem(K_CSS, css); localStorage.setItem(K_CHROME, chrome); }catch(e){}
        injectCss(css); document.body.innerHTML = chrome;
        return true;
      });
    }).catch(function(err){
      /* 皮肤不可用 → 用内置兜底外壳，保证仍能阅读档案 */
      buildFallbackShell();
      console.warn('皮肤装载失败：', err && err.message || err);
      return false;
    });
  }

  function applyTheme(css){
    /* 从皮肤 CSS 里找出「body.xxx」形式的主题类名，随机套用一个 */
    var names = {}, re = /body\.([A-Za-z0-9_-]+)/g, m;
    while ((m = re.exec(css || ''))) names[m[1]] = 1;
    var list = Object.keys(names);
    if (!list.length) return '';
    var pick = null, keys = ['east','west','south','north'];
    var hit = [];
    list.forEach(function(n){
      var low = n.toLowerCase();
      for (var i=0;i<keys.length;i++) if (low.indexOf(keys[i]) !== -1) hit.push({ n:n, k:keys[i] });
    });
    if (hit.length){ pick = hit[Math.floor(Math.random()*hit.length)]; }
    else { pick = { n: list[Math.floor(Math.random()*list.length)], k:'' }; }
    try{ document.body.className = String(document.body.className||'').replace(/\b(t-|th-|dom-|theme-)[\w-]*/g,'').trim(); }catch(e){}
    document.body.classList.add(pick.n);
    try{ localStorage.setItem(K_THEME, pick.k); }catch(e){}
    return pick.k;
  }

  /* =======================================================================

  var cache = {};
  function readDoc(file){
    if (cache[file]) return Promise.resolve(cache[file]);
    return fetch(file, { cache:'no-store' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(t){ cache[file] = t; return t; });
  }
  function archDoc(file, title){
    SFX.click();
    var loading = '<div class="arcdoc"><div style="color:var(--muted);font-family:ui-monospace,monospace;font-size:12px;">▸ 正在读取 ' + esc(file) + ' …</div></div>';
    var box;
    if (IS_M){ openMobile(title, loading); box = document.querySelector('#mLayer .m-body'); }
    else { var w = openWin(title, 'q://' + file, loading, 'doc'); box = w.querySelector('.win-body'); }
    readDoc(file).then(function(md){
      if (box) box.innerHTML = '<div class="arcdoc">' + mdToHtml(md) + '<div class="arc-src">◈ 来源文件：' + esc(file) + '（改内容直接改这个 md 即可）</div></div>';
      if (box) box.scrollTop = 0;
    }).catch(function(err){
      if (box) box.innerHTML = '<div class="arcdoc"><h1>' + esc(title) + '</h1><blockquote>⚠ 无法读取档案文件：' + esc(file) +
        '<br><br>可能原因：① 文件未上传；② 用 file:// 直接双击打开（浏览器禁止读取同目录文件）。<br>请通过网站访问，或本地起静态服务（<code>python -m http.server</code>）。' +
        '<br><br>错误：' + esc(err && err.message || err) + '</blockquote></div>';
    });
  }
  function inline(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
  }
  function mdToHtml(md){
    var lines = String(md).replace(/\r\n?/g,'\n').split('\n');
    var out = [], tbl = null, list = false, code = false, quote = false;
    function fl(){ if (list){ out.push('</ul>'); list=false; } }
    function fq(){ if (quote){ out.push('</blockquote>'); quote=false; } }
    function ft(){
      if (!tbl) return;
      var h = '<table><thead><tr>';
      tbl.head.forEach(function(c){ h += '<th>' + inline(c) + '</th>'; });
      h += '</tr></thead><tbody>';
      tbl.rows.forEach(function(r){ h += '<tr>'; r.forEach(function(c){ h += '<td>' + inline(c) + '</td>'; }); h += '</tr>'; });
      out.push(h + '</tbody></table>'); tbl = null;
    }
    function all(){ fl(); fq(); ft(); }
    for (var i=0;i<lines.length;i++){
      var ln = lines[i], m;
      if (/^\s*```/.test(ln)){ all(); if (!code){ out.push('<pre><code>'); code=true; } else { out.push('</code></pre>'); code=false; } continue; }
      if (code){ out.push(esc(ln)); continue; }
      if (/^\s*$/.test(ln)){ all(); continue; }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(ln))){ all(); var lv=Math.min(m[1].length,3); out.push('<h'+lv+'>' + inline(m[2]) + '</h'+lv+'>'); continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ all(); out.push('<hr>'); continue; }
      if (/^\s*>/.test(ln)){ fl(); ft(); if (!quote){ out.push('<blockquote>'); quote=true; } out.push('<div>' + inline(ln.replace(/^\s*>\s?/,'')) + '</div>'); continue; }
      if (/^\s*\|(.+)\|\s*$/.test(ln)){
        fl(); fq();
        if (/^\s*\|[\s:|-]+\|\s*$/.test(ln)) continue;
        var cells = ln.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(s){ return s.trim(); });
        if (!tbl) tbl = { head:cells, rows:[] }; else tbl.rows.push(cells);
        continue;
      } else ft();
      if ((m = /^\s*(?:[-*+]|\d+\.)\s+(.*)$/.exec(ln))){
        fq(); ft();
        if (!list){ out.push('<ul>'); list=true; }
        out.push('<li>' + inline(m[1]) + '</li>'); continue;
      }
      all(); out.push('<p>' + inline(ln) + '</p>');
    }
    all(); if (code) out.push('</code></pre>');
    return out.join('\n');
  }

      '.arcdoc blockquote{margin:10px 0;padding:9px 12px;border-left:3px solid var(--pink,#ff6b9d);background:rgba(255,107,157,.07);font-size:13px;}' +
      '.arcdoc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;}' +
      '.arcdoc th,.arcdoc td{border:1px solid rgba(90,140,190,.35);padding:6px 9px;text-align:left;vertical-align:top;}' +
      '.arcdoc th{background:rgba(34,211,238,.09);color:var(--cyan,#22d3ee);font-family:ui-monospace,monospace;font-size:11.5px;}' +
      '.arcdoc hr{border:0;border-top:1px dashed rgba(90,140,190,.4);margin:16px 0;}' +
      '.arcdoc code{font-family:ui-monospace,monospace;font-size:12px;background:rgba(34,211,238,.1);border-radius:4px;padding:1px 5px;}' +
      '.arcdoc pre{overflow:auto;border:1px solid rgba(90,140,190,.35);border-radius:8px;padding:10px;}' +
      '.win-body,.m-body{max-height:min(74vh,640px);overflow-y:auto;}';
    var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
  }

  /* ---------------- 事件委托：音效 ---------------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-sfx]') : null;
    if (!el) return;
    var k = el.getAttribute('data-sfx');
    if (SFX[k]) SFX[k]();
  }, true);
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest ? e.target.closest('.dapp,.arc-card') : null;
    if (el && el !== window.__hov){ window.__hov = el; SFX.hover(); }
  }, true);

  /* ---------------- 对外暴露（给克隆出来的界面调用） ---------------- */
  window.doGuest = doGuest;
  window.logout = logout;
  window.archOpen = archOpen;
  window.archDoc = archDoc;
  window.arcCloseMobile = function(){ SFX.close(); var ml=$('mLayer'); if (ml) ml.innerHTML=''; };
  window.openOverview = function(){ archOpen('geo'); };
  window.openArchive  = function(){ archAll(); };
  window.openTimeline = function(){ archOpen('history'); };
  function archAll(){
    SFX.click();
    var total = 0; ARCH.forEach(function(a){ if (!a.special) total += a.files.length; });
    var h = '<h1>档案总目录</h1><div class="app-sub">ALL FILES · 共 ' + total + ' 份（世界观设定 / 角色档案）</div>';
    ARCH.forEach(function(a){
      if (a.special) return;
      h += '<div style="margin:14px 0 6px;font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;color:var(--gold,#ffd76b);">▸ ' + esc(a.nm) + '</div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">';
      a.files.forEach(function(f){
        h += '<div data-sfx="open" onclick="archDoc(\'' + f.f + '\',\'' + esc(f.t) + '\')" class="arc-card">' +
          '<div class="arc-no">' + f.n + '</div><div class="arc-tt">' + esc(f.t) + '</div><div class="arc-de">' + esc(f.d) + '</div></div>';
      });
      h += '</div>';
    });
    openWin('档案总目录', 'q://archive/all', h, 'arc-all');
  }
  /* 原界面里可能引用到的函数 → 全部空实现，避免报错 */
  ['openVisits','statTip','statRender','statWarn','statKickOut','tiredOut','doLogin','doReg','openApp','sbInit','sbPull','clearVisits','openMaint','openAdm','openAssist','openForum','openSocial','openNews']
    .forEach(function(n){ if (typeof window[n] !== 'function') window[n] = function(){}; });
  window.__exportSkin = function(){
    try{
      var css = localStorage.getItem(K_CSS) || '';
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([css], { type:'text/css;charset=utf-8' }));
      a.download = 'style.css'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
      toast('已导出 style.css（放进同目录即可不再依赖 四分境域.html）');
    }catch(e){ toast('导出失败：' + e.message); }
  };

  /* ---------------- 启动 ---------------- */
  loadSkin().then(function(ok){
    var msg = $('arcMsg'); if (msg) msg.parentNode.removeChild(msg);
    var css = ''; try{ css = localStorage.getItem(K_CSS) || ''; }catch(e){}
    injectDocCss();
    pruneUI();
    applyTheme(css);
    if (!ok) injectCss(localStorage.getItem(K_CSS) || '');
    /* 移动端切换时清掉窗口，避免错位 */
    matchMedia('(max-width: 780px)').addEventListener('change', function(ev){ IS_M = ev.matches; closeAll(); });
    boot();
    if (ok) setTimeout(selfCheck, 400);
    console.log('%c四分境域档案库（精简版）已载入 · 8 个档案 App · 音乐与音效已保留', 'color:#22d3ee');
  });
})();
</script>
</body>
</html>
